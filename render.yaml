services:
  - type: web
    name: collegestay-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Set the rest (MONGO_URI, JWT_SECRET, BREVO_*, CLOUDINARY_*, CLIENT_URL) in the Render dashboard.

  - type: web
    name: collegestay-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # This is the piece that fixes "works on first load, 404s on direct/refresh/new-tab":
      # every unmatched path falls back to index.html so React Router can handle it client-side.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
